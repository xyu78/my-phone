<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 仿生桌面聊天机</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style id="custom-css">
  /* 用户自定义的美化 CSS 会注入到这里 */
</style>
<style>
  :root {
    --bg-image: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
    --widget-bg: rgba(255, 255, 255, 0.85);
  }
  
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    background: #333;
    font-family: -apple-system, Helvetica, sans-serif;
  }

  /* 手机容器 */
  #phone {
    width: 100vw;
    height: 100vh;
    max-width: 430px;
    background: var(--bg-image);
    background-size: cover;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 顶部云朵时间挂件 */
  #cloud-widget {
    margin: 40px 20px 20px;
    background: var(--widget-bg);
    border-radius: 40px;
    padding: 20px 25px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    cursor: pointer;
  }
  .time-area h1 { margin: 0; font-size: 36px; color: #333; }
  .time-area p { margin: 5px 0 0; color: #666; font-size: 14px; }
  .weather-area { text-align: right; }
  .weather-area i { font-size: 28px; color: #f39c12; }
  .weather-area p { margin: 5px 0 0; color: #333; font-weight: bold; }

  /* 桌面图标区域 */
  #desktop-apps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 10px;
    padding: 20px;
    flex-grow: 1;
  }
  .app-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
    font-size: 12px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .app-icon .icon-box {
    width: 55px;
    height: 55px;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    margin-bottom: 5px;
    background: #fff;
    color: #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .bg-wechat { background: #07C160 !important; color: white !important; }
  .bg-twitter { background: #1DA1F2 !important; color: white !important; }
  .bg-ins { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%) !important; color: white !important; }

  /* 底部 Dock 栏 */
  #dock {
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(15px);
    margin: 15px;
    border-radius: 30px;
    padding: 15px;
    display: flex;
    justify-content: space-around;
  }

  /* 聊天界面 (仿微信) */
  #chat-app {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ededed;
    transition: top 0.3s ease;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }
  #chat-app.active { top: 0; }
  
  .chat-header {
    background: #ededed;
    padding: 40px 15px 15px;
    display: flex;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
  }
  .chat-header i { margin-right: 15px; cursor: pointer; font-size: 20px; }
  
  #chat-box {
    flex-grow: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  
  .message {
    display: flex;
    margin-bottom: 20px;
    max-width: 85%;
  }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.ai { align-self: flex-start; }
  
  .avatar {
    width: 40px; height: 40px; border-radius: 5px; background: #ccc;
    display: flex; justify-content: center; align-items: center; color: white;
  }
  .message.user .avatar { background: #07C160; margin-left: 10px; }
  .message.ai .avatar { background: #1DA1F2; margin-right: 10px; }
  
  .bubble {
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 16px;
    line-height: 1.4;
    word-break: break-all;
  }
  .message.user .bubble { background: #95ec69; }
  .message.ai .bubble { background: #fff; }

  /* 聊天输入区 */
  .chat-input-area {
    background: #f7f7f7;
    padding: 10px 15px 30px;
    border-top: 1px solid #ddd;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .chat-input-area input {
    flex-grow: 1; padding: 10px; border: none; border-radius: 5px; font-size: 16px; outline: none;
  }
  .btn-send, .btn-generate {
    padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold;
  }
  .btn-send { background: #07C160; }
  .btn-generate { background: #1DA1F2; }

  /* 弹窗样式 */
  .modal {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center;
  }
  .modal-content {
    background: white; width: 80%; padding: 20px; border-radius: 15px;
  }
  .modal textarea, .modal input { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>

<div id="phone">
  <!-- 桌面 -->
  <div id="cloud-widget" onclick="openModal('weatherModal')">
    <div class="time-area">
      <h1 id="clock">00:00</h1>
      <p id="date">1月1日 星期一</p>
    </div>
    <div class="weather-area">
      <i class="fa-solid fa-sun"></i>
      <p id="city-weather">北京 | 25°C</p>
    </div>
  </div>

  <div id="desktop-apps">
    <div class="app-icon" onclick="openChat()">
      <div class="icon-box bg-wechat"><i class="fa-brands fa-weixin"></i></div>
      <span>私聊</span>
    </div>
    <div class="app-icon">
      <div class="icon-box bg-twitter"><i class="fa-brands fa-twitter"></i></div>
      <span>Twitter</span>
    </div>
    <div class="app-icon">
      <div class="icon-box bg-ins"><i class="fa-brands fa-instagram"></i></div>
      <span>Instagram</span>
    </div>
  </div>

  <div id="dock">
    <div class="app-icon" onclick="openModal('presetModal')">
      <div class="icon-box"><i class="fa-solid fa-robot"></i></div>
      <span>预设</span>
    </div>
    <div class="app-icon" onclick="openModal('beautyModal')">
      <div class="icon-box"><i class="fa-solid fa-palette"></i></div>
      <span>美化</span>
    </div>
    <div class="app-icon">
      <div class="icon-box"><i class="fa-solid fa-gear"></i></div>
      <span>设置</span>
    </div>
  </div>

  <!-- 聊天界面 -->
  <div id="chat-app">
    <div class="chat-header">
      <i class="fa-solid fa-chevron-left" onclick="closeChat()"></i>
      <span>人类好朋友</span>
    </div>
    <div id="chat-box">
      <!-- 聊天记录将渲染在这里 -->
    </div>
    <div class="chat-input-area">
      <input type="text" id="msg-input" placeholder="发消息..." onkeypress="handleEnter(event)">
      <button class="btn-send" onclick="sendMessage()">发送</button>
      <button class="btn-generate" onclick="generateAIResponse()">生成</button>
    </div>
  </div>

  <!-- 弹窗区 -->
  <!-- 1. 城市天气设置 -->
  <div class="modal" id="weatherModal">
    <div class="modal-content">
      <h3>设置城市与天气</h3>
      <input type="text" id="input-city" placeholder="例如: 杭州 | 阴天 18°C">
      <button onclick="saveWeather()">保存</button>
      <button onclick="closeModal('weatherModal')">关闭</button>
    </div>
  </div>

  <!-- 2. 预设 (规则/限制词) -->
  <div class="modal" id="presetModal">
    <div class="modal-content">
      <h3>AI 预设规则 (System Prompt 附加)</h3>
      <p style="font-size:12px;color:gray;">在这里加入限制词或特定回复规则</p>
      <textarea id="input-preset" rows="5" placeholder="例如：你必须在每句话结尾加喵。限制词：不能提到苹果。"></textarea>
      <input type="text" id="api-key" placeholder="输入 OpenAI API Key (必填)">
      <button onclick="savePreset()">保存</button>
      <button onclick="closeModal('presetModal')">关闭</button>
    </div>
  </div>

  <!-- 3. 美化 (注入自定义 CSS) -->
  <div class="modal" id="beautyModal">
    <div class="modal-content">
      <h3>美化 (注入 CSS)</h3>
      <textarea id="input-css" rows="5" placeholder="body { background: red; }"></textarea>
      <button onclick="saveBeauty()">应用美化</button>
      <button onclick="closeModal('beautyModal')">关闭</button>
    </div>
  </div>
</div>

<script>
  // ---------------- 1. 挂件时间感知逻辑 ----------------
  function updateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').innerText = `${hours}:${minutes}`;
    
    const month = now.getMonth() + 1;
    const date = now.getDate();
    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const day = days[now.getDay()];
    document.getElementById('date').innerText = `${month}月${date}日 ${day}`;
  }
  setInterval(updateTime, 1000);
  updateTime();

  // ---------------- 2. 弹窗控制与保存 ----------------
  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  
  function saveWeather() {
    const val = document.getElementById('input-city').value;
    if(val) document.getElementById('city-weather').innerText = val;
    closeModal('weatherModal');
  }

  function saveBeauty() {
    const css = document.getElementById('input-css').value;
    document.getElementById('custom-css').innerHTML = css;
    closeModal('beautyModal');
  }

  let customRule = "";
  let apiKey = "";
  function savePreset() {
    customRule = document.getElementById('input-preset').value;
    apiKey = document.getElementById('api-key').value;
    closeModal('presetModal');
    alert("预设和 API Key 已保存（仅在本地网页生效）");
  }

  // ---------------- 3. 聊天与 API 逻辑 ----------------
  let messages = []; // 本地聊天记录
  const chatBox = document.getElementById('chat-box');
  const msgInput = document.getElementById('msg-input');

  function openChat() { document.getElementById('chat-app').classList.add('active'); }
  function closeChat() { document.getElementById('chat-app').classList.remove('active'); }

  function renderMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    const avatarIcon = sender === 'user' ? 'fa-user' : 'fa-robot';
    msgDiv.innerHTML = `
      <div class="avatar"><i class="fa-solid ${avatarIcon}"></i></div>
      <div class="bubble">${text}</div>
    `;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    
    // 渲染到屏幕左边(如果想改左边，CSS里把 flex-direction-reverse 去掉，这里保持仿微信右边)
    renderMessage(text, 'user');
    messages.push({ role: 'user', content: text });
    msgInput.value = '';
  }

  async function generateAIResponse() {
    if (!apiKey) {
      alert("请先在底部的【预设】面板中输入 API Key！");
      return;
    }
    if (messages.length === 0) return;

    // 按钮变成加载状态
    const btn = document.querySelector('.btn-generate');
    btn.innerText = '生成中...';

    // 核心系统提示词 (Prompt)
    let systemPrompt = `你现在是一个真实的、有血有肉的人类，正在通过微信和你的好朋友私聊。绝不能提到你是AI。回复要口语化，带一点情绪。仔细阅读前面的聊天记录，像真人一样对我说的话做出真实反应，字数多一点，有话头，模拟生活感。`;
    if (customRule) systemPrompt += `\n额外限制与规则：${customRule}`;

    // 截取前五次对话历史 (即最后10条消息)
    const contextMessages = messages.slice(-10);
    const apiMessages = [
      { role: 'system', content: systemPrompt },
      ...contextMessages
    ];

    try {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'gpt-3.5-turbo', // 你可以修改为 gpt-4 或 gpt-4o
          messages: apiMessages,
          temperature: 0.8
        })
      });

      const data = await response.json();
      if(data.error) {
        alert("API 错误: " + data.error.message);
      } else {
        const aiText = data.choices[0].message.content;
        renderMessage(aiText, 'ai');
        messages.push({ role: 'assistant', content: aiText });
      }
    } catch (err) {
      alert("网络请求失败，请检查是否需要魔法上网或 API 地址是否正确。");
    } finally {
      btn.innerText = '生成';
    }
  }
</script>
</body>
</html>
